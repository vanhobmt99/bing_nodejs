global:
    scrape_interval: 30s
    evaluation_interval: 30s

scrape_configs:
    - job_name: microsoft-rewards
      metrics_path: /metrics
      authorization:
          type: Bearer
          credentials_file: /tmp/rewards-api-token
      static_configs:
          - targets: ['microsoft-rewards-script:3010']
            labels:
                deployment: local
