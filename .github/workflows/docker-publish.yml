name: Build and Push Docker

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-publish-${{ github.ref }}
    cancel-in-progress: false

env:
    DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
    validate:
        uses: ./.github/workflows/validate.yml

    publish:
        name: Publish AMD64 and ARM64 images
        needs: validate
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Set image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build and push
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=gha,version=2,scope=docker-main
                  cache-to: type=gha,version=2,scope=docker-main,mode=max
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
            - name: Verify published platforms
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
                  jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] as $arches | (["amd64", "arm64"] - $arches | length == 0)' manifest.json
                  printf 'Published `%s@%s` for AMD64 and ARM64.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
